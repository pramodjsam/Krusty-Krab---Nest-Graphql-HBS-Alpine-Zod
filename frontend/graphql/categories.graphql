query getCategories(
  $page: Int
  $limit: Int
  $sort: [[String]]
  $search: String
) {
  categories: getCategories(
    page: $page
    limit: $limit
    sort: $sort
    search: $search
  ) {
    data {
      id
      name
      image {
        url
      }
    }
    pagination {
      itemsPerPage
      totalItems
      currentPage
      totalPages
    }
  }
}

query getCategoriesName(
  $page: Int
  $limit: Int
  $sort: [[String]]
  $search: String
) {
  categories: getCategories(
    page: $page
    limit: $limit
    sort: $sort
    search: $search
  ) {
    data {
      id
      name
    }
    pagination {
      itemsPerPage
      totalItems
      currentPage
      totalPages
    }
  }
}

query getCategory($id: Int!) {
  category: getCategory(id: $id) {
    id
    name
    image {
      url
    }
  }
}

mutation deleteCategory($id: Int!) {
  delete: deleteCategory(id: $id) {
    success
    message
  }
}

mutation createCategory($createCategory: CreateCategoryDto!, $file: Upload) {
  category: createCategory(createCategory: $createCategory, file: $file) {
    id
  }
}

mutation updateCategory(
  $id: Int!
  $updateCategory: UpdateCategoryDto!
  $file: Upload
) {
  category: updateCategory(
    id: $id
    updateCategory: $updateCategory
    file: $file
  ) {
    id
    name
    createdAt
    updatedAt
  }
}

query getProducts($page: Int, $limit: Int, $sort: [[String]], $search: String) {
  products: getProducts(
    page: $page
    limit: $limit
    sort: $sort
    search: $search
  ) {
    data {
      id
      name
      price
      image {
        url
      }
      category {
        id
        name
      }
    }
    pagination {
      itemsPerPage
      totalItems
      currentPage
      totalPages
    }
  }
}

mutation deleteProduct($id: Int!) {
  delete: deleteProduct(id: $id) {
    success
    message
  }
}

mutation updateProduct(
  $id: Int!
  $updateProduct: UpdateProductDto!
  $file: Upload
) {
  product: updateProduct(id: $id, updateProduct: $updateProduct, file: $file) {
    id
  }
}

mutation createProduct($createProduct: CreateProductDto!, $file: Upload) {
  product: createProduct(createProduct: $createProduct, file: $file) {
    id
  }
}

query getProduct($id: Int!) {
  product: getProduct(id: $id) {
    id
    name
    price
    category {
      id
      name
    }
    image {
      url
    }
  }
}

query getUsers($page: Int, $limit: Int, $sort: [[String]], $search: String) {
  users: getUsers(page: $page, limit: $limit, sort: $sort, search: $search) {
    data {
      id
      name
      email
      role
      createdAt
    }
    pagination {
      itemsPerPage
      totalItems
      currentPage
      totalPages
    }
  }
}

mutation updateUser($id: Int!, $updateUser: UpdateUserDto!) {
  user: updateUser(id: $id, updateUser: $updateUser) {
    id
  }
}

query getOrders($page: Int, $limit: Int, $sort: [[String]], $search: String) {
  orders: getAllOrders(
    page: $page
    limit: $limit
    sort: $sort
    search: $search
  ) {
    data {
      id
      user {
        name
      }
      paymentMethod
      totalPrice
      isPaid
      status
    }
    pagination {
      itemsPerPage
      totalItems
      currentPage
      totalPages
    }
  }
}

query getOrder($id: Int!) {
  order: getOrder(id: $id) {
    id
    status
    address
    city
    province
    zipCode
    user {
      name
    }
    orderItem {
      id
      price
      quantity
      product {
        name
        category {
          name
        }
      }
    }
  }
}

mutation updateOrder($id: Int!, $updateOrder: UpdateOrderDto!) {
  order: updateOrder(id: $id, updateOrder: $updateOrder) {
    id
  }
}

