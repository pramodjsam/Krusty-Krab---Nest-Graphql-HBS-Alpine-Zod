  }
}

mutation syncCart($syncCartInput: SyncCartInput!) {
  cart: syncCart(syncCartInput: $syncCartInput) {
    id
    cartItem {
      id
      quantity
      productId
    }
  }
}

mutation updateCart($id: Int!, $updateCart: UpdateCartItemDto!) {
  cart: updateCartItem(id: $id, updateCart: $updateCart) {
    id
    quantity
    productId
    cartId
  }
}

mutation updateUserCart($updateUserCart: UpdateUserCartDto!) {
